<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍Explorer Log</h1>
            <p>Registre suas aventuras!!</p>
        </header>

        <div class="form-card">
            <input type="text" id="ipt-url" placeholder="URL da imagem">
            <input type="text" id="ipt-legenda" placeholder="Onde você estava?">

            <div class="row">
                <input type="number" id="ipt-lat" placeholder="Latitude">
                <input type="number" id="ipt-lng" placeholder="Longitude">
            </div>
            <div class="button-group">
                <button type="button" id="btn-adicionar">Adicionar ao Mural</button>
                <button type="button" id="btn-localizacao" class="secondary-btn">📍 Localização Atual</button>
            </div>
        </div>
        <!--Galeria-->
        <div id="galeria" class="grid-galeria">
            <!-- Os cards serão injetados aqui -->

        </div>
    </div>
    
    <script src="script/script.js"></script>
</body>
</html>
